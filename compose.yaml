services:
  backend:
    build: ./backend
    init: true
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      ORS_API_KEY: ${ORS_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/health').then(async r => { if (!r.ok || (await r.json()).status !== 'ok') process.exitCode = 1 }).catch(() => process.exitCode = 1)"]
      interval: 3s
      timeout: 3s
      retries: 10
